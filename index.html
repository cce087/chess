<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajedrez Online Gratis - Supabase</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 24px 12px;
            background-color: #2c3e50;
            color: #ecf0f1;
            box-sizing: border-box;
        }
        .board-wrap { width: 600px; max-width: 95vw; margin: 0 auto; }
        #board { width: 100%; margin: 8px 0; }
        #board .sq-selected { box-shadow: inset 0 0 0 4px #f1c40f !important; }
        .captured { min-height: 2.2em; font-size: 1.6em; letter-spacing: 2px; text-align: center; background-color: rgba(0,0,0,0.25); border-radius: 6px; padding: 4px 8px; margin: 6px 0; }
        .captured small { display: block; font-size: 0.45em; letter-spacing: 1px; color: #bdc3c7; }
        .captured img { height: 1.4em; vertical-align: middle; margin: 0 1px; }
        .player-label { font-weight: bold; margin: 6px 0; font-size: 1.05em; }
        select { padding: 10px; font-size: 1em; border-radius: 6px; margin: 4px; }
        #status { margin-top: 16px; font-weight: bold; font-size: 1.2em; text-align: center; min-height: 2em; }
        #share-container { margin-bottom: 16px; text-align: center; }
        button { padding: 12px 24px; font-size: 1em; cursor: pointer; background-color: #3498db; color: white; border: none; border-radius: 6px; transition: background-color 0.2s; margin: 4px; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #7f8c8d; cursor: not-allowed; }
        button.secondary { background-color: #16a085; }
        button.secondary:hover { background-color: #138d75; }
        #link-partida a { color: #1abc9c; word-break: break-all; display: block; margin-top: 10px; }
        .info-panel { text-align: center; padding: 20px; background-color: rgba(0,0,0,0.2); border-radius: 8px; max-width: 780px; width: 95%; }
        #save-container, #replay-bar, #saved-list { margin-top: 14px; text-align: center; }
        #replay-bar { display: none; }
        #replay-count { font-weight: bold; margin: 0 8px; }
        #saved-list button { display: block; margin: 6px auto; font-size: 0.9em; padding: 8px 16px; }
    </style>
</head>
<body>

    <div class="info-panel">
        <div id="share-container">
            <button id="btn-crear">Crear Nueva Partida</button>
            <button id="btn-bot">Jugar contra máquina</button>
            <select id="sel-dif">
                <option value="bajo">Nivel: bajo</option>
                <option value="medio">Nivel: medio</option>
                <option value="alto">Nivel: alto</option>
            </select>
            <p id="link-partida"></p>
        </div>
        <div class="board-wrap">
            <div id="label-top" class="player-label"></div>
            <div id="captured-top" class="captured"><small>BLANCAS COMIDAS</small><span>—</span></div>
            <div id="board"></div>
            <div id="captured-bottom" class="captured"><small>NEGRAS COMIDAS</small><span>—</span></div>
            <div id="label-bottom" class="player-label"></div>
        </div>
        <div id="status">Crea o únete a una partida para empezar</div>
        <div id="save-container" style="display:none;">
            <button id="btn-save" class="secondary">Guardar partida (PGN)</button>
            <button id="btn-replay" class="secondary">Ver repetición</button>
        </div>
        <div id="replay-bar">
            <button id="btn-first" title="Inicio">|&lt;</button>
            <button id="btn-prev" title="Anterior">&lt;</button>
            <span id="replay-count">Jugada 0 / 0</span>
            <button id="btn-next" title="Siguiente">&gt;</button>
            <button id="btn-last" title="Final">&gt;|</button>
            <button id="btn-exit">Volver en vivo</button>
        </div>
        <div id="saved-list"></div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    
    <!-- Supabase SDK (UMD pineado: expone window.supabase) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"></script>
    
    <script>
        // ============================================================
        // 1. CONFIGURACIÓN DE SUPABASE
        // ============================================================
        const supabaseUrl = 'TU_PROYECTO_SUPABASE_URL';
        const supabaseAnonKey = 'TU_PROYECTO_ANON_KEY';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        // ============================================================
        // 2. VARIABLES GLOBALES Y ESTADO DEL JUEGO
        // ============================================================
        let game = new Chess();
        let board = null;
        let roomId = new URLSearchParams(window.location.search).get('room');
        let playerColor = 'w'; // 'w' = blancas, 'b' = negras
        let isGameReady = false;
        let selectedSquare = null;
        let replayMode = false;
        let replayMoves = [];
        let replayIndex = 0;
        let replayGame = new Chess();
        let nombreW = '';
        let nombreB = '';
        let botMode = false;
        let botLevel = 'bajo';
        let engine = null;
        let engineReady = false;
        const PIECE_IMG = 'https://chessboardjs.com/img/chesspieces/wikipedia/{c}{t}.png';
        const PIECE_VALUE = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
        const START_COUNT = { p: 8, n: 2, b: 2, r: 2, q: 1, k: 1 };
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const shareContainer = document.getElementById('share-container');
        const linkPartidaElement = document.getElementById('link-partida');

        // Guardia: si algún CDN falla, avisa en vez de morir en silencio
        (function checkCdns() {
            var faltan = [];
            if (typeof Chess === 'undefined') faltan.push('chess.js');
            if (typeof Chessboard === 'undefined') faltan.push('chessboard.js');
            if (!window.supabase || !window.supabase.createClient) faltan.push('supabase-js');
            if (faltan.length) {
                statusElement.innerText = 'Error cargando librerías: ' + faltan.join(', ') + '. Recarga con Ctrl+F5.';
                throw new Error('CDN caídos: ' + faltan.join(', '));
            }
        })();

        // ============================================================
        // 3. INICIALIZACIÓN DEL TABLERO
        // ============================================================
        function initBoard() {
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                orientation: playerColor === 'w' ? 'white' : 'black',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            // Click-para-mover: clic origen + clic destino (delegado, compatible móvil)
            $('#board').off('click.cb').on('click.cb', '[data-square], [class*="square-"]', function () {
                var sq = $(this).attr('data-square');
                if (!sq) {
                    var m = (this.className || '').match(/square-([a-h][1-8])/);
                    if (m) sq = m[1];
                }
                if (sq) handleSquareClick(sq);
            });
        }

        function canPlay() {
            if (replayMode || game.game_over() || !isGameReady) return false;
            if (game.turn() !== playerColor) return false;
            return true;
        }

        function sqEl(sq) {
            return $('#board [data-square="' + sq + '"], #board .square-' + sq);
        }

        function clearSelection() {
            selectedSquare = null;
            $('#board [data-square], #board [class*="square-"]').removeClass('sq-selected');
        }

        function selectSquare(sq) {
            clearSelection();
            selectedSquare = sq;
            sqEl(sq).addClass('sq-selected');
        }

        function handleSquareClick(sq) {
            if (!canPlay()) return;
            var piece = game.get(sq);
            if (selectedSquare === null) {
                // Solo selecciona pieza propia en tu turno
                if (piece && piece.color === playerColor && piece.color === game.turn()) {
                    selectSquare(sq);
                    statusElement.innerText = 'Pieza ' + sq + ' seleccionada (' + nombreDe(playerColor) + '). Elige destino.';
                }
                return;
            }
            if (selectedSquare === sq) {
                clearSelection();
                return;
            }
            // Si clica otra pieza propia, cambia selección
            if (piece && piece.color === playerColor && piece.color === game.turn()) {
                selectSquare(sq);
                return;
            }
            var ok = tryMove(selectedSquare, sq);
            clearSelection();
            if (!ok) {
                statusElement.innerText = 'Movimiento no legal. Elige otra casilla.';
            }
        }

        // Ejecuta movimiento local y sincroniza. Devuelve true si legal.
        function tryMove(from, to) {
            var move = game.move({ from: from, to: to, promotion: 'q' });
            if (move === null) return false;
            board.position(game.fen());
            sendMove();
            return true;
        }

        function sendMove() {
            if (roomId) {
                supabaseClient.from('partidas').update({
                    fen: game.fen(),
                    turno: game.turn()
                }).eq('id', roomId).then(function (res) {
                    if (res.error) console.error("Error al enviar movimiento:", res.error);
                });
            }
            actualizarEstado();
            if (botMode && !game.game_over() && game.turn() !== playerColor) {
                setTimeout(botMove, 450);
            }
        }

        // ============================================================
        // 4. LÓGICA DE SALA Y SINCRONIZACIÓN SUPABASE
        // ============================================================
        function setupRoom() {
            if (roomId) {
                // El jugador 2 entra a una sala existente
                playerColor = 'b';
                shareContainer.style.display = 'none';
                statusElement.innerText = 'Conectado a la sala: ' + roomId + '. Pide tu nombre...';
                unirseAPartida(roomId).then(function (ok) {
                    if (ok) listenToRoom(roomId);
                });
            } else {
                // El jugador 1 puede crear una sala o jugar contra máquina
                document.getElementById('btn-crear').addEventListener('click', crearPartida);
                document.getElementById('btn-bot').addEventListener('click', startBotMode);
                statusElement.innerText = 'Pulsa "Crear Nueva Partida" para empezar.';
            }
        }

        function pedirNombre() {
            var guardado = '';
            try { guardado = localStorage.getItem('ajedrez_nombre') || ''; } catch (e) {}
            var nombre = prompt('Tu nombre:', guardado || 'Jugador');
            if (nombre === null) return null; // canceló
            nombre = (nombre || 'Jugador').slice(0, 20);
            try { localStorage.setItem('ajedrez_nombre', nombre); } catch (e) {}
            return nombre;
        }

        function nombreDe(color) {
            if (color === 'w') return nombreW || 'Blancas';
            return nombreB || 'Negras';
        }

        function updateLabels() {
            // Etiquetas fijas a cada lado del tablero según orientación
            var topColor = (playerColor === 'w') ? 'b' : 'w';
            var botColor = (playerColor === 'w') ? 'w' : 'b';
            document.getElementById('label-top').innerText =
                (topColor === 'w' ? 'Blancas: ' : 'Negras: ') + nombreDe(topColor);
            document.getElementById('label-bottom').innerText =
                (botColor === 'w' ? 'Blancas: ' : 'Negras: ') + nombreDe(botColor);
        }

        // Aplica fila remota: FEN + nombres
        function aplicarFila(row) {
            if (!row) return;
            if (row.nombre_w) nombreW = row.nombre_w;
            if (row.nombre_b) nombreB = row.nombre_b;
            if (game.fen() !== row.fen) {
                game.load(row.fen);
                clearSelection();
                if (!replayMode) board.position(row.fen);
            }
            updateLabels();
        }

        async function crearPartida() {
            var nombre = pedirNombre();
            if (nombre === null) return;
            nombreW = nombre;
            roomId = Math.random().toString(36).substring(2, 7).toUpperCase();
            const gameLink = window.location.origin + window.location.pathname + '?room=' + roomId;

            linkPartidaElement.innerHTML = `Comparte este enlace para jugar: <a href="${gameLink}" target="_blank">${gameLink}</a>`;

            // Guarda el estado inicial en Supabase
            const { error } = await supabaseClient.from('partidas').insert({
                id: roomId,
                fen: game.fen(),
                turno: 'w',
                creador: 'w',
                nombre_w: nombreW
            });
            if (error) {
                console.error("Error al crear la partida:", error);
                statusElement.innerText = 'Error al crear la partida. Revisa consola (F12).';
                return;
            }
            isGameReady = true;
            updateLabels();
            statusElement.innerText = 'Partida creada. Esperando oponente...';
            listenToRoom(roomId);
        }

        async function unirseAPartida(id) {
            var nombre = pedirNombre();
            if (nombre === null) {
                statusElement.innerText = 'Necesitas un nombre para unirte.';
                return false;
            }
            nombreB = nombre;
            // Registra nombre del invitado (ignora error si columna aún no existe)
            var res = await supabaseClient.from('partidas').update({ nombre_b: nombreB }).eq('id', id);
            if (res.error) console.error("Aviso nombre invitado:", res.error);
            return true;
        }

        async function listenToRoom(id) {
            // Carga estado actual (por si invitado entra tarde)
            const { data, error } = await supabaseClient.from('partidas').select('*').eq('id', id).single();
            if (error) {
                console.error("Error al cargar la sala:", error);
                statusElement.innerText = 'Sala no encontrada. Revisa enlace.';
                return;
            }
            aplicarFila(data);
            isGameReady = true;
            actualizarEstado();

            // Suscripción tiempo real (SDK v2)
            supabaseClient.channel('room-' + id)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'partidas', filter: 'id=eq.' + id }, (payload) => {
                    const row = payload.new;
                    if (row && game.fen() !== row.fen) {
                        aplicarFila(row);
                        actualizarEstado();
                    } else if (row) {
                        aplicarFila(row);
                        actualizarEstado();
                    }
                })
                .subscribe();
        }

        // ============================================================
        // 4b. MODO CONTRA MÁQUINA
        // ============================================================
        function startBotMode() {
            var nombre = pedirNombre();
            if (nombre === null) return;
            botMode = true;
            roomId = null;
            playerColor = 'w';
            botLevel = document.getElementById('sel-dif').value;
            nombreW = nombre;
            nombreB = 'Máquina (' + botLevel + ')';
            game.reset();
            board.orientation('white');
            board.position('start');
            clearSelection();
            shareContainer.style.display = 'none';
            isGameReady = true;
            updateLabels();
            actualizarEstado();
            if (botLevel === 'alto') ensureEngine();
        }

        function botMove() {
            if (!botMode || replayMode || game.game_over()) return;
            if (game.turn() === playerColor) return;
            if (botLevel === 'alto' && engineReady) {
                requestEngineMove();
                return;
            }
            var moves = game.moves({ verbose: true });
            if (!moves.length) return;
            var chosen = (botLevel === 'medio') ? greedyMove(moves) : moves[Math.floor(Math.random() * moves.length)];
            game.move({ from: chosen.from, to: chosen.to, promotion: chosen.promotion || 'q' });
            board.position(game.fen());
            actualizarEstado();
        }

        function greedyMove(moves) {
            var best = null;
            var bestScore = -Infinity;
            moves.forEach(function (m) {
                var score = Math.random() * 0.6; // desempate aleatorio
                if (m.captured) score += 10 * (PIECE_VALUE[m.captured] || 0);
                if (m.promotion) score += 8;
                if (m.san && m.san.indexOf('#') !== -1) score += 100;
                else if (m.san && m.san.indexOf('+') !== -1) score += 1.5;
                if (score > bestScore) { bestScore = score; best = m; }
            });
            return best || moves[Math.floor(Math.random() * moves.length)];
        }

        function ensureEngine(cb) {
            if (engine) { if (cb) cb(engineReady); return; }
            if (typeof STOCKFISH === 'undefined') {
                var s = document.createElement('script');
                s.src = 'https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js';
                s.onload = function () { initEngine(cb); };
                s.onerror = function () {
                    console.error('Stockfish CDN falló, uso nivel medio.');
                    botLevel = 'medio';
                    nombreB = 'Máquina (medio)';
                    updateLabels();
                    if (cb) cb(false);
                };
                document.head.appendChild(s);
            } else {
                initEngine(cb);
            }
        }

        function initEngine(cb) {
            try {
                engine = STOCKFISH();
                engine.onmessage = onEngineMsg;
                engine.postMessage('uci');
                var check = setInterval(function () {
                    if (engineReady) { clearInterval(check); if (cb) cb(true); }
                }, 200);
                setTimeout(function () { clearInterval(check); if (cb && !engineReady) cb(false); }, 8000);
            } catch (e) {
                console.error('No arranca Stockfish:', e);
                botLevel = 'medio';
                if (cb) cb(false);
            }
        }

        function onEngineMsg(line) {
            var msg = (typeof line === 'string') ? line : (line && line.data);
            if (!msg) return;
            if (msg.indexOf('uciok') !== -1) {
                engine.postMessage('setoption name Skill Level value 12');
                engineReady = true;
                return;
            }
            if (msg.indexOf('bestmove') === 0) {
                var parts = msg.split(' ');
                var uci = parts[1];
                if (!uci || uci === '(none)') return;
                var ok = game.move({ from: uci.slice(0, 2), to: uci.slice(2, 4), promotion: uci.slice(4, 5) || 'q' });
                if (ok) {
                    board.position(game.fen());
                    actualizarEstado();
                }
            }
        }

        function requestEngineMove() {
            statusElement.innerText = 'Máquina pensando...';
            try {
                engine.postMessage('position fen ' + game.fen());
                engine.postMessage('go depth 12');
                setTimeout(function () {
                    // Si motor no responde, juega glotón
                    if (botMode && !game.game_over() && game.turn() !== playerColor) {
                        var moves = game.moves({ verbose: true });
                        if (moves.length && statusElement.innerText === 'Máquina pensando...') {
                            var c = greedyMove(moves);
                            game.move({ from: c.from, to: c.to, promotion: c.promotion || 'q' });
                            board.position(game.fen());
                            actualizarEstado();
                        }
                    }
                }, 12000);
            } catch (e) {
                console.error('Motor falló:', e);
                engineReady = false;
                botMove();
            }
        }

        // ============================================================
        // 5. CONTROLADORES DE MOVIMIENTO (CHESS.JS)
        // ============================================================
        function onDragStart(source, piece, position, orientation) {
            if (!canPlay()) return false;

            // Evitar que el jugador mueva las piezas del color contrario
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) || (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        function onDrop(source, target) {
            // Intentar realizar el movimiento usando chess.js
            var ok = tryMove(source, target);

            // Si el movimiento no es legal, chess.js devuelve null
            if (!ok) return 'snapback';
            clearSelection();
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        // ============================================================
        // 6. ACTUALIZACIÓN DEL ESTADO
        // ============================================================
        function actualizarEstado() {
            let statusText = '';
            let elTurno = (game.turn() === 'w') ? 'Blancas' : 'Negras';

            if (game.in_checkmate()) {
                statusText = '¡Jaque Mate! Ganan las ' + (game.turn() === 'w' ? 'Negras' : 'Blancas');
            } else if (game.in_draw()) {
                statusText = 'Tablas (Empate).';
            } else if (game.in_stalemate()) {
                statusText = 'Rey ahogado. Tablas.';
            } else {
                statusText = 'Turno de las ' + elTurno;
                if (game.in_check()) {
                    statusText += ' ¡Jaque!';
                }
                if (!isGameReady) {
                    statusText = 'Esperando a que se una otro jugador...';
                }
            }
            statusElement.innerText = statusText;
            renderCaptured();
            var over = game.game_over();
            document.getElementById('save-container').style.display = over ? 'block' : 'none';
            if (!over && replayMode) exitReplay();
        }

        // ============================================================
        // 6b. PIEZAS CAPTURADAS (imágenes color exacto)
        // ============================================================
        function pieceImg(color, type) {
            return '<img src="' + PIECE_IMG.replace('{c}', color).replace('{t}', type.toUpperCase()) + '" alt="">';
        }

        function renderCaptured() {
            var present = { w: { p: 0, n: 0, b: 0, r: 0, q: 0, k: 0 }, b: { p: 0, n: 0, b: 0, r: 0, q: 0, k: 0 } };
            game.board().forEach(function (row) {
                row.forEach(function (sq) {
                    if (sq) present[sq.color][sq.type]++;
                });
            });
            var eatenWhite = '';
            var eatenBlack = '';
            ['q', 'r', 'b', 'n', 'p'].forEach(function (t) {
                var mw = START_COUNT[t] - present.w[t];
                var mb = START_COUNT[t] - present.b[t];
                for (var i = 0; i < mw; i++) eatenWhite += pieceImg('w', t);
                for (var j = 0; j < mb; j++) eatenBlack += pieceImg('b', t);
            });
            document.querySelector('#captured-top span').innerHTML = eatenWhite || '—';
            document.querySelector('#captured-bottom span').innerHTML = eatenBlack || '—';
        }

        // ============================================================
        // 6c. GUARDAR PARTIDA + REPETICIÓN JUGADA A JUGADA
        // ============================================================
        function gameResult() {
            if (game.in_checkmate()) return game.turn() === 'w' ? '0-1 Ganan negras' : '1-0 Ganan blancas';
            if (game.in_draw() || game.in_stalemate()) return 'Tablas 1/2-1/2';
            return 'En curso';
        }

        function guardarPartida() {
            var pgn = game.pgn();
            if (!pgn) {
                statusElement.innerText = 'Nada que guardar: sin jugadas.';
                return;
            }
            var fecha = new Date().toLocaleString('es-ES');
            var registro = {
                id: Date.now(),
                sala: roomId || 'local',
                fecha: fecha,
                resultado: gameResult(),
                pgn: pgn
            };
            var guardadas = [];
            try {
                guardadas = JSON.parse(localStorage.getItem('ajedrez_guardadas') || '[]');
            } catch (e) { guardadas = []; }
            guardadas.push(registro);
            localStorage.setItem('ajedrez_guardadas', JSON.stringify(guardadas));
            // Descarga archivo .pgn
            var blob = new Blob([pgn], { type: 'text/plain;charset=utf-8' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'partida-' + registro.sala + '.pgn';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            renderSavedList();
            statusElement.innerText = 'Partida guardada (' + registro.resultado + '). Archivo PGN descargado.';
        }

        function renderSavedList() {
            var cont = document.getElementById('saved-list');
            var guardadas = [];
            try {
                guardadas = JSON.parse(localStorage.getItem('ajedrez_guardadas') || '[]');
            } catch (e) { guardadas = []; }
            cont.innerHTML = '';
            if (!guardadas.length) return;
            var title = document.createElement('p');
            title.innerText = 'Partidas guardadas en este navegador:';
            cont.appendChild(title);
            guardadas.slice().reverse().forEach(function (g) {
                var b = document.createElement('button');
                b.innerText = 'Repetir ' + g.fecha + ' (' + g.resultado + ')';
                b.addEventListener('click', function () { enterReplayFromPgn(g.pgn); });
                cont.appendChild(b);
            });
        }

        function enterReplay(moves) {
            replayMode = true;
            replayMoves = moves;
            replayIndex = moves.length;
            clearSelection();
            drawReplay();
            document.getElementById('replay-bar').style.display = 'block';
            document.getElementById('save-container').style.display = 'none';
        }

        function enterReplayFromPgn(pgn) {
            var tmp = new Chess();
            if (!tmp.load_pgn(pgn)) {
                statusElement.innerText = 'PGN inválido, no se puede repetir.';
                return;
            }
            enterReplay(tmp.history({ verbose: true }));
        }

        function drawReplay() {
            replayGame = new Chess();
            for (var i = 0; i < replayIndex; i++) {
                var m = replayMoves[i];
                replayGame.move({ from: m.from, to: m.to, promotion: m.promotion || 'q' });
            }
            board.position(replayGame.fen());
            document.getElementById('replay-count').innerText = 'Jugada ' + replayIndex + ' / ' + replayMoves.length;
        }

        function stepReplay(d) {
            replayIndex = Math.max(0, Math.min(replayMoves.length, replayIndex + d));
            drawReplay();
        }

        function exitReplay() {
            replayMode = false;
            document.getElementById('replay-bar').style.display = 'none';
            board.position(game.fen());
            actualizarEstado();
        }

        // ============================================================
        // 7. INICIO DE LA APLICACIÓN
        // ============================================================
        if (roomId) playerColor = 'b'; // color antes de dibujar tablero
        initBoard();
        setupRoom();
        renderCaptured();
        renderSavedList();
        document.getElementById('btn-save').addEventListener('click', guardarPartida);
        document.getElementById('btn-replay').addEventListener('click', function () {
            enterReplay(game.history({ verbose: true }));
        });
        document.getElementById('btn-first').addEventListener('click', function () { replayIndex = 0; drawReplay(); });
        document.getElementById('btn-prev').addEventListener('click', function () { stepReplay(-1); });
        document.getElementById('btn-next').addEventListener('click', function () { stepReplay(1); });
        document.getElementById('btn-last').addEventListener('click', function () { replayIndex = replayMoves.length; drawReplay(); });
        document.getElementById('btn-exit').addEventListener('click', exitReplay);
    </script>
</body>
</html>
